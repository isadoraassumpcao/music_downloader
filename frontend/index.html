<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" href="music.ico">

    <meta charset="UTF-8">

    <title>YT Music Downloader</title>

    <link rel="stylesheet" href="style.css">



</head>

<body>

    <header class="header">
        <img src="music.png" class="logo" alt="Music Logo">
        <h1>Music Downloader</h1>
    </header>

    <textarea
    id="songInput"
    placeholder="One song per line..."
    rows="10"></textarea>

<button id="downloadButton">

    Download All

</button>

<button id="clearButton">
    Clear Queue
</button>

<h2>Queue</h2>

<div id="queue"></div>

    <p id="status"></p>

    <script src="app.js"></script>

</body>

</html>
